<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>University Registration Form</title>
</head>
<body>
   
    <h1>University Registration Form</h1>
    <p>Please fill out the form below to register</p>
    <hr>
    <h2>Personal Details</h2>
    <form>
        <label for="FName">First Name:</label>
        <input type="text" id="FName" name="firstName" placeholder="e.g wajiha" >
        <br><br>

        <label for="LName">Last Name:</label>
        <input type="text" id="LName" name="lastName" placeholder="e.g Fatima" >
        <br><br>

        <label for="DOB">Date of Birth:</label>
        <input type="date" id="DOB" name="DOB" >
        <br>

        <h3>Gender:</h3>

        <label for="male">Male:</label>
        <input type="radio" id="male" name="Gender" value="male">
        <br>

        <label for="female">FeMale:</label>
        <input type="radio" id="female" name="Gender" value="female">
        <br>

        <label for="other">Other:</label>
        <input type="radio" id="other" name="Gender" value="other">
        <br>

        <p>Upload your photo here:</p>
        <input type="file" name="file">
        <br><br>
        <hr>

        <h2>Contact Information:</h2>
         
        <label for="Email">Email Adddress:</label>
        <input type="email" id="Email" name="Email" placeholder="e.g 1234@gmail.com"  required>
        <br><br>

        <label for="Phone">Phone Number:</label>
        <input type="tel" id="Phone" name="Phone" placeholder="03671389248"  required>
        <br><br>

        <label for="mail">Mailing Addresses:</label>
        <br>
        <textarea id="mail" name="MailingAddresses" rows="3" cols="15"></textarea>
        <br><br>
        <hr>

        <h2>Academic Information:</h2>

        <label for="course">Choose your courses:</label>
      
        <select id="course" name="courses">
         
        <option value=" " selected disabled>--Select Course--</option>
        <option value="CN">Computer Networking</option>
        <option value="Programming">Programming</option>
        <option value="IS">Information Security</option>
        </select>

        <h3>Extracurricular Activities:</h3>

        <label for="sports">sports:</label>
        <input type="checkbox" id="sports" name="Activities" value="sports">
        <br>
        <label for="arts">arts&music</label>
        <input type="checkbox" id="arts" name="Activities" value="arts">
        <br>
        <label for="Volunteering">Volunteering:</label>
        <input type="checkbox" id="Volunteering" name="Activities" value="Volunteering">
        <br><br>
        <hr>

        <h2>Create Your Account:</h2>

        <label for="Password">Create a password:</label>
        <input type="password" id="Password" name="Password" placeholder="e.g123">
        <br><br>
        <label for="sec">Security Answer:</label>
        <input type="text" id="sec" name="Security" >
        <br><br>
        <input type="checkbox" id="policy" name="policy" value="accepted" required>
        <label for="policy">I agree to term and conditions</label>
             
        <hr>

        <button type="submit">Register</button>
        <button type="reset">Clear Form</button>

        <br><br>

    </form>
</body>
</html>
